<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4f0" />
    <title>ATRIUM — Spatial studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('atrium-theme')
          if (t !== 'light' && t !== 'dark') {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <style>
      html, body, #root { margin: 0; height: 100%; }
      html[data-theme='light'] { background: #f6f4f0; }
      html[data-theme='dark'] { background: #0c0c0d; }
      .boot {
        min-height: 100%;
        display: grid;
        place-items: center;
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        letter-spacing: 0.22em;
        font-size: 18px;
        color: #ff4d00;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">ATRIUM</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
